<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YONSEI MOVE — UX 프로토타입</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--yb:#003876;--ydeep:#00205b;--y660:#407ec9;--gold:#ffc72c;--g432:#333f48;--g7543:#98a4ae;--yb2:#2f6db5;--ybl:#e9f0fa;--bg:#eef2f7;--card:#fff;--ink:#1d2731;--mute:#5f6b78;--line:#dfe5ee;
--walk:#333f48;--elc:#0f8a4f;--elcl:#e7f6ee;--loc:#2f80ed;--dest:#d9342b;--ok:#15803d;--okl:#ecfdf3;--warn:#a16207;--warnl:#fef9e7;--bad:#b91c1c;--badl:#fef2f2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#cfd6e0;font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;color:var(--ink);display:flex;flex-direction:column;align-items:center;font-size:14px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
input{font:inherit}
.ic{flex:none;vertical-align:middle}
.phone{width:100%;max-width:420px;height:100dvh;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column}
#app{flex:1;display:flex;flex-direction:column;min-height:0}
.caption{display:none}
@media(min-width:520px){body{justify-content:center;padding:20px 0;background:#e9edf2}.phone{--sat:54px;--sab:26px;width:393px;max-width:393px;height:min(852px,calc(100vh - 40px));border-radius:58px;border:11px solid #121212;outline:2px solid #3a3a3c;box-shadow:0 0 0 1px #000,0 40px 90px rgba(2,12,40,.35)}.sbar,.island,.hind{display:flex!important}
.caption{display:block;margin-top:12px;font-size:12px;color:#475569}}
/* header */
.hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:calc(12px + var(--sat)) 14px 10px;background:var(--yb);color:#fff;border-bottom:4px solid var(--gold)}
.logo{display:flex;align-items:center;gap:8px;justify-self:center}.logo b{display:block;font-family:Cinzel,"Noto Sans KR",serif;font-weight:700;font-size:17px;letter-spacing:.06em;line-height:1.1}
.logo small{display:block;font-size:10px;font-weight:500;opacity:.8;letter-spacing:.02em}
.simchip{justify-self:end;font-size:10px;font-weight:700;background:rgba(255,255,255,.16);border-radius:999px;padding:4px 9px}
.hclock{justify-self:start;font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;opacity:.9}
.sub-hd{display:flex;align-items:center;gap:6px;padding:calc(10px + var(--sat)) 10px 8px;background:var(--yb);color:#fff;border-bottom:4px solid var(--gold)}
.sub-hd h2{margin:0;font-size:17px;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px}
.iconbtn:active{background:rgba(127,140,160,.18)}
main{flex:1;overflow-y:auto;padding:12px 14px 28px;min-height:0;background:repeating-linear-gradient(0deg,#eaf0f7 0 3px,#f1f5fa 3px 6px)}
/* tabs */
.tabs{display:flex;background:#fff;border-top:1px solid var(--line);padding:4px 4px calc(4px + var(--sab))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:700;color:#94a3b8}
.tabs button{position:relative}.tabs button.on{color:var(--yb)}.tabs button.on::before{content:"";position:absolute;top:-4px;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
/* common */
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid var(--line);box-shadow:0 1px 3px rgba(0,32,91,.05)}
.sec-t{font-size:15px;font-weight:800;margin:0 0 10px;display:flex;align-items:center;gap:6px;border-left:4px solid var(--y660);padding-left:8px;color:var(--ydeep)}
.sec-t .r{margin-left:auto;font-size:12px;font-weight:500;color:var(--mute)}
.mute{color:var(--mute)}.small{font-size:12px}.tiny{font-size:11px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border-radius:8px;padding:13px 0;font-weight:800;font-size:15px;background:var(--yb);color:#fff}
.btn.sec{background:#fff;color:var(--yb);border:1.5px solid #c7d4ea}
.btn.ghost{background:#f1f5f9;color:var(--ink)}
.btn.elc{background:var(--elc)}.btn.walk{background:var(--walk)}
.btn:active{opacity:.85}
.row{display:flex;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.p-ok{background:var(--okl);color:var(--ok)}.p-warn{background:var(--warnl);color:var(--warn)}.p-bad{background:var(--badl);color:var(--bad)}.p-info{background:var(--ybl);color:var(--yb)}.p-gray{background:#f1f5f9;color:var(--mute)}
.banner{display:flex;gap:8px;align-items:flex-start;background:var(--warnl);color:#713f12;border-radius:14px;padding:10px 12px;font-size:12px;line-height:1.55;margin-bottom:12px}
.banner b{font-weight:800}
.linkbtn{color:var(--yb2);font-weight:700;font-size:13px;text-decoration:underline;text-underline-offset:3px}
/* route bar */
.rbar{display:flex;align-items:stretch;gap:8px;background:#fff;border-radius:18px;padding:8px;margin-bottom:12px;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.rcol{flex:1;display:grid;grid-template-rows:1fr 1fr;gap:6px;min-width:0}
.rf{display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:12px;min-width:0;background:#f6f8fb;width:100%;min-height:46px}
.rf:active{background:#f1f5f9}
.rf+.rf{border-top:0}
.rl{font-size:11px;font-weight:700;color:var(--mute);width:28px;flex:none}
.rv{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.chipst{color:var(--mute);font-weight:500}
.rv.empty{color:#94a3b8;font-weight:500}
.mk-loc{width:12px;height:12px;border-radius:50%;background:var(--loc);box-shadow:0 0 0 3px #cfe1fb;flex:none}
.mk-start{width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--yb);flex:none}
.mk-dest{color:var(--dest);display:flex}
.rbtns{display:grid;grid-template-rows:1fr 1fr;gap:6px}
.swap,.favb{width:46px;height:100%;min-height:46px;border-radius:12px;background:#f1f5f9;display:grid;place-items:center;color:var(--yb)}
.favb.on{background:#fff7e0;color:#d97706}
/* widget */
.wwrap{margin-bottom:12px}
.wlabel{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mute);margin:0 4px 6px}
.wlabel .dots{margin-left:auto;width:32px;height:26px;border-radius:8px;font-weight:900;letter-spacing:1px}
.wmenu{background:#fff;border-radius:14px;box-shadow:0 8px 24px rgba(15,23,42,.15);margin:0 0 8px;overflow:hidden}
.wmenu button{display:block;width:100%;padding:12px 14px;font-weight:600;border-bottom:1px solid var(--line)}
.wmenu button:last-child{border:0}
.widget{display:block;width:100%;background:#fff;color:var(--ydeep);border-radius:16px;padding:16px 18px;text-align:left;border:1px solid var(--line);border-left:5px solid var(--y660);box-shadow:0 1px 3px rgba(0,32,91,.06)}
.widget-x:active{filter:brightness(1.1)}
.wtop{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--mute)}
.wcd{color:var(--yb);font-size:40px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1;margin:6px 0 4px}
.wcd small{font-size:13px;font-weight:700;color:var(--mute);margin-left:6px;letter-spacing:0}
.wsub{font-size:13px;line-height:1.5;color:var(--g432)}
.wsub .pill{margin:4px 0 0;white-space:normal}
.wupd{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.18);font-size:12px;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.live{background:#4ade80;animation:pulse 1.6s infinite}
.dot.lag{background:#facc15}.dot.off{background:#f87171}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.7)}100%{box-shadow:0 0 0 8px rgba(74,222,128,0)}}
.upd-off{color:#fecaca;font-weight:700}.upd-lag{color:#fde68a;font-weight:700}
.updline{font-size:12px;display:flex;align-items:center;gap:6px;color:var(--mute)}
.updline .upd-off{color:var(--bad)}.updline .upd-lag{color:var(--warn)}
/* rec mini */
.recmini{display:flex;align-items:center;gap:12px;width:100%}
.modeic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.mi-shuttle{background:var(--yb)}.mi-elecle{background:var(--elc)}.mi-walk{background:var(--walk)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-weight:700;font-size:13px}
.chip.on{border-color:var(--yb);background:var(--ybl);color:var(--yb)}
/* map */
.layers{display:flex;gap:6px;margin-bottom:10px}
.layer{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:7px 2px;font-size:12px;font-weight:700;color:#94a3b8}
.layer .ln{width:44px;height:6px}
.layer.on{color:var(--ink);border-color:#94a3b8}
.layer .st{font-size:10px;font-weight:500}
.mapbox{position:relative;background:#fff;border-radius:18px;overflow:hidden;margin-bottom:12px;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.mapw{position:relative}.osmattr{position:absolute;right:4px;bottom:3px;font-size:9px;color:#475569;background:rgba(255,255,255,.75);padding:1px 4px;border-radius:4px;pointer-events:none}
svg.map{display:block;width:100%;height:auto;touch-action:manipulation}
svg.map .tap{cursor:pointer}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;padding:10px 12px;font-size:11.5px;color:#334155;border-top:1px solid var(--line)}
.legend span{display:flex;align-items:center;gap:6px}
/* compare */
.prio .prow{display:grid;grid-template-columns:78px 1fr 64px;align-items:center;gap:8px;padding:6px 0}
.prio label{font-weight:700;display:flex;align-items:center;gap:6px}
.prio input[type=range]{width:100%;accent-color:var(--yb);height:28px}
.plv{font-size:12px;font-weight:800;color:var(--yb);text-align:right}
.scale{display:grid;grid-template-columns:78px 1fr 64px;gap:8px;font-size:10px;color:#94a3b8;margin-top:-2px}
.scale span{display:flex;justify-content:space-between}
.bars .br{display:grid;grid-template-columns:92px 1fr 46px;align-items:center;gap:8px;padding:5px 0}
.bars .bn{font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px}
.bars .bt{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.bar{display:flex;height:16px;border-radius:6px;overflow:hidden;background:#f1f5f9}
.bar i{display:block;height:100%}
.sg-walk{background:#a3adbb}
.sg-wait{background:#f5c242}
.sg-ride{background:var(--yb)}.sg-elc{background:var(--elc)}.sg-prep{background:#9ee0bd}
.br.ghost{opacity:.75}
.bkey{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--mute);margin-top:6px}
.bkey i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:4px;vertical-align:middle}
.rec{border:2px solid var(--yb)}
.rec ul{margin:8px 0 0;padding-left:18px;line-height:1.6;font-size:13px}
.rec li{margin-bottom:2px}
.mcard .mh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.mcard .mname{font-weight:800;font-size:15px}
.mcard .mtot{margin-left:auto;text-align:right}
.mcard .mtot b{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.steps{list-style:none;margin:0 0 10px;padding:0}
.steps li{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:start;padding:7px 0;border-top:1px dashed var(--line);font-size:13px;line-height:1.45}
.steps li:first-child{border-top:0}
.steps .n{width:22px;height:22px;border-radius:50%;background:#f1f5f9;display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--mute)}
.steps .v{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.kv{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;font-size:12px;line-height:1.5}
.pc div{background:#f8fafc;border-radius:10px;padding:8px 10px}
.pc b{display:block;font-size:11px;margin-bottom:2px}
.pc ul{margin:0;padding-left:14px}
.miss{background:#f8fafc;border-radius:12px;padding:10px;margin-bottom:10px;font-size:12.5px;line-height:1.5}
.miss .mrow{display:grid;grid-template-columns:86px 1fr 52px;align-items:center;gap:8px;margin:4px 0}
.miss .mrow b{text-align:right;font-variant-numeric:tabular-nums}
.tag-rec{background:var(--yb);color:#fff}
/* shuttle */
.kvt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.kvt div{background:#f8fafc;border-radius:12px;padding:10px}
.kvt .l{font-size:11px;color:var(--mute);font-weight:700;display:flex;align-items:center;gap:4px}
.kvt .v{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.kvt .s{font-size:11px;color:var(--mute)}
.stoplist button{display:grid;grid-template-columns:22px 1fr auto auto;gap:8px;align-items:center;width:100%;padding:11px 2px;border-top:1px solid var(--line);font-size:13.5px}
.stoplist button:first-child{border-top:0}
.sq{width:16px;height:16px;border-radius:4px;background:var(--yb);display:grid;place-items:center;color:#fff;font-size:9px;font-weight:900}
.tcol{text-align:right;font-variant-numeric:tabular-nums;font-size:12px;line-height:1.3}
.tcol b{font-size:13px}
.ttgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.ttgrid span{text-align:center;padding:7px 0;border-radius:9px;background:#f8fafc;font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:700}
.ttgrid .past{color:#cbd5e1;font-weight:500}
.ttgrid .nx{background:var(--yb);color:#fff}
details summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;font-weight:800}
details summary::-webkit-details-marker{display:none}
details summary .chev{margin-left:auto;display:flex;transition:transform .2s;color:var(--mute)}
details[open] summary .chev{transform:rotate(90deg)}
.reason{font-size:12px;line-height:1.6;color:#334155;margin:6px 0 0;padding-left:16px}
/* stop */
.photo{border-radius:16px;overflow:hidden;position:relative;margin-bottom:12px}
.photo .cap{position:absolute;left:8px;bottom:8px;background:rgba(15,23,42,.75);color:#fff;font-size:11px;border-radius:8px;padding:3px 8px}
ol.guide{margin:0;padding-left:20px;line-height:1.7;font-size:13.5px}
ul.how{margin:0;padding-left:18px;line-height:1.7;font-size:13.5px}
/* nav */
.navstep{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:12px;border-radius:14px;margin-bottom:6px;background:#fff;border:1.5px solid transparent;opacity:.55}
.navstep.cur{opacity:1;border-color:var(--yb);box-shadow:0 4px 14px rgba(0,56,118,.12)}
.navstep.done{opacity:.45}
.navstep .si{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#f1f5f9;color:var(--ink)}
.navstep.cur .si{background:var(--yb);color:#fff}
.navstep b{display:block;font-size:14px}
.navstep p{margin:2px 0 0;font-size:12.5px;color:var(--mute);line-height:1.5}
.navbar{display:flex;gap:8px;padding:10px 14px calc(10px + var(--sab));background:#fff;border-top:1px solid var(--line)}
/* my/help */
.list>button,.list .li{display:flex;align-items:center;gap:10px;width:100%;padding:13px 2px;border-top:1px solid var(--line);font-size:14px}
.list>:first-child{border-top:0!important}
.list .grow{flex:1;min-width:0}
.switch{width:46px;height:28px;border-radius:999px;background:#cbd5e1;position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--yb)}.switch.on::after{left:21px}
.help details{border-top:1px solid var(--line);padding:13px 2px}
.help details:first-child{border-top:0}
.help .body{font-size:13px;line-height:1.7;color:#334155;margin-top:8px}
.help .body ol,.help .body ul{margin:4px 0;padding-left:18px}
.favrow{display:flex;align-items:center;gap:8px;padding:11px 0;border-top:1px solid var(--line)}
.favrow:first-child{border-top:0}
.favrow .grow{flex:1;min-width:0}
.favrow .nm{font-weight:800}
.favrow .rt{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbtn{font-size:12px;font-weight:800;border-radius:10px;padding:8px 10px;background:var(--ybl);color:var(--yb)}
.sbtn.del{background:#f1f5f9;color:var(--mute)}.sbtn.del.cf{background:var(--bad);color:#fff}
/* picker */
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #c7d4ea;border-radius:14px;padding:0 12px;margin-bottom:12px}
.search input{flex:1;border:0;outline:0;padding:13px 0;font-size:15px;background:transparent}
.plist button{display:flex;align-items:center;gap:10px;width:100%;padding:12px 4px;border-top:1px solid var(--line)}
.plist button:first-child{border-top:0}
.plist .pi{width:34px;height:34px;border-radius:10px;background:#f1f5f9;display:grid;place-items:center;color:var(--yb);flex:none}
.plist .pn{font-weight:700}
.plist .pd{font-size:12px;color:var(--mute)}
.plist button.dis{opacity:.4}
.lbl{font-size:12px;font-weight:800;color:var(--mute);margin:14px 2px 6px}
/* onboarding */
.onb{flex:1;display:flex;flex-direction:column;min-height:0;background:#fff}
.onb-hd{display:flex;align-items:center;gap:8px;padding:calc(12px + var(--sat)) 10px 6px}
.prog{display:flex;gap:5px;margin-left:auto;margin-right:12px}
.prog i{width:18px;height:5px;border-radius:4px;background:#e2e8f0}
.prog i.on{background:var(--yb)}
.onb-body{flex:1;overflow-y:auto;padding:8px 20px 20px}
.onb h2{font-size:23px;font-weight:900;line-height:1.35;margin:8px 0 8px;letter-spacing:-.02em}
.onb .lead{color:var(--mute);line-height:1.6;margin:0 0 18px}
.onb-ft{padding:12px 20px calc(16px + var(--sab));display:flex;flex-direction:column;gap:8px}
.hero{background:#fff;margin:-8px -20px 18px;padding:34px 24px 26px;text-align:center;border-bottom:1px solid var(--line)}.hero .band{height:10px;background:var(--yb);border-bottom:4px solid var(--gold);margin:-34px -24px 34px}
.hero .big{font-family:Cinzel,"Noto Sans KR",serif;font-size:31px;font-weight:700;letter-spacing:.06em;color:var(--yb);margin-top:14px}
.hero .tl{font-size:15px;margin-top:4px;font-weight:700;color:var(--g432)}.hero .tl2{font-size:12px;margin-top:2px;color:var(--g7543);letter-spacing:.12em;font-family:Cinzel,serif}
.feat{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px;line-height:1.5}
.feat .fi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.feat b{display:block}
.osdlg{background:#f2f2f7;border-radius:18px;overflow:hidden;text-align:center;margin:8px 4px 10px;border:1px solid #d9d9e0}
.osdlg .t{padding:18px 16px 12px;font-size:15px;font-weight:700;line-height:1.4}
.osdlg .d{font-size:12.5px;font-weight:400;color:#3c3c43;margin-top:6px;line-height:1.5}
.osdlg button{display:block;width:100%;padding:13px;border-top:1px solid #d1d1d6;color:#0a64d8;font-size:15px}
.osdlg button.b{font-weight:700}
.note{font-size:12px;color:var(--mute);line-height:1.6;background:#f8fafc;border-radius:12px;padding:10px 12px}

  let h=noSvcBanner()+`<div class="seg" role="tablist">${['down','up'].map(d=>`<button role="tab" aria-selected="${d===dir}" class="${d===dir?'on':''}" data-act="dir" data-d="${d}">${DIRL[d]}</button>`).join('')}</div>`;

function timetableHTML(dir){const now=T;let nextDep=null;if(svcOn())for(const tr of TRIPS)if(tr.dir===dir&&tr.dep>=now){nextDep=tr.i;break}
 let h=`<p class="small mute" style="margin:8px 0 4px;line-height:1.6">기간 2026.9.1(화) ~ 12.21(월) · <b style="color:var(--bad)">주말·공휴일 운행 없음</b></p>`;

   const past=svcOn()&&hs[1]*60+mm<now;const isNext=nextDep!=null&&TRIPS[nextDep].gi===gi&&TRIPS[nextDep].dep%60===mm&&Math.floor(TRIPS[nextDep].dep/60)>=hs[0]&&Math.floor(TRIPS[nextDep].dep/60)<=hs[1];
   return`<span class="${past&&!hh.includes('~')?'past':''} ${red?'red':''} ${isNext?'nx':''}">${pad(mm)}</span>`}).join('')}</span></div>`});h+='</div>'});

 ph.appendChild(c);let sec=0,timer=null;
 const t0=setTimeout(()=>{const st=$('#cst');if(st)st.textContent='00:00';timer=setInterval(()=>{sec++;const st2=$('#cst');if(st2)st2.textContent=pad(Math.floor(sec/60))+':'+pad(sec%60)},1000)},2200);
 c.querySelector('.cs-end').addEventListener('click',()=>{clearTimeout(t0);clearInterval(timer);c.classList.add('bye');setTimeout(()=>c.remove(),350);toast(sec?`통화 종료 · ${pad(Math.floor(sec/60))}:${pad(sec%60)}`:'통화를 취소했어요.')})}
function after(){const fdn=$('#fdname');if(fdn)fdn.addEventListener('input',()=>{S.fd.name=fdn.value});const q=$('#q');if(q)q.addEventListener('input',()=>{$('#qres').innerHTML=pickerList(q.dataset.field,q.value.trim())});
 const fn=$('#favname');if(fn)fn.addEventListener('input',()=>S.favName=fn.value);live()}
function live(){document.querySelectorAll('[data-k]').forEach(el=>{const k=el.dataset.k;
  if(k==='clock')el.textContent=clk(T);else if(k==='sbclock'){const m=Math.floor(T)%1440;el.textContent=Math.floor(m/60)+':'+pad(m%60)}else if(k==='upd'||k==='updl')el.innerHTML=updHTML();
  else if(k==='cdm'){const tr=TRIPS[+el.dataset.i];if(tr)el.textContent=Math.max(0,Math.ceil(est(tr,+el.dataset.s).a-T))}
  else if(k==='cd'){const tr=TRIPS[+el.dataset.i];if(tr){const e=est(tr,+el.dataset.s);el.textContent=cd(e.a-T)}}});
 document.querySelectorAll('.buses').forEach(g=>g.innerHTML=busesSVG());
 const{top}=cur();if(top&&top.type==='nav'){const ns=navState(top);if(ns){const g=document.getElementById('navme');if(g&&ns.pos)g.setAttribute('transform',`translate(${ns.pos[0].toFixed(1)},${ns.pos[1].toFixed(1)})`);
  const rem=document.querySelector('[data-k="navrem"]');if(rem&&ns.st.path){const left=Math.max(0,Math.round(ns.st.m*(1-ns.f)/10)*10);rem.textContent=ns.f>=1?`${ns.st.to}에 도착했어요`:`${ns.st.to}까지 ${left}m${ns.st.bus?' · 셔틀로 이동 중':ns.st.bike?' · 자전거로 이동 중':''}`}
  if(ns.st.path&&ns.f>=1&&!top.adv&&top.step<(top.n||1)-1){top.adv=true;setTimeout(()=>{if(cur().top===top&&top.adv){top.step++;top.t0=performance.now();top.adv=false;fillDyn()}},1400)}}}}
let toastT;function toast(m){const t=$('#toast');t.innerHTML=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2800)}

/* ================= 동작 ================= */
const ACT={
 tab:d=>{S.tab=d.t;S.stack=[];S.wmenu=false;S.delCf=null;render()},
 back:()=>{S.stack.pop();render()},
 pick:d=>{S.stack.push({type:'pick',field:d.field});render()},
 choose:d=>{if(d.field==='wgFrom'||d.field==='wgTo'){let id=d.id;if(d.field==='wgFrom'&&stopIdx(id)<0)id=STOPS[P(id).at].id;S.wg[d.field==='wgFrom'?'from':'to']=id;persist();S.openGrp=null;S.stack.pop();render();return}
  if(d.field==='favFrom'||d.field==='favTo'){let id=d.id;if(d.field==='favFrom'&&stopIdx(id)<0)id=STOPS[P(id).at].id;S.fd[d.field==='favFrom'?'from':'to']=id;S.openGrp=null;S.stack.pop();render();return}
  if(d.field==='from'&&stopIdx(d.id)<0){const k=P(d.id).at;toast(`${P(d.id).name}에서 가장 가까운 ${STOPS[k].name} 정류장에서 출발해요.`);d={field:'from',id:STOPS[k].id}}const other=d.field==='from'?S.to:S.from;if(d.id===other){toast(d.field==='from'?'이미 목적지로 선택한 곳이에요. 다른 곳을 고르거나 ⇅로 바꾸세요.':'이미 출발지로 선택한 곳이에요. 다른 곳을 고르세요.');return}
  S[d.field]=d.id;S.openGrp=null;if(S.step){S.step=S.step==='from'&&!S.to?'to':null;if(!S.step)S.tab='home';persist();render();return}persist();
  S.stack.pop();render();toast(`${d.field==='from'?'출발지':'목적지'}를 ${placeName(d.id)}(으)로 바꿨어요.`)},
 swap:()=>{if(!S.from&&!S.to)return toast('먼저 출발지와 목적지를 선택하세요.');let nf=S.to,nt=S.from,msg='출발지와 목적지를 바꿨어요.';if(nf&&stopIdx(nf)<0){const n=nearestStop(nf);nf=STOPS[n.k].id;msg=`출발은 정류장 기준이라 ${n.k+1}번 ${STOPS[n.k].name} 정류장에서 출발하도록 바꿨어요.`}S.from=nf;S.to=nt;S.dir=null;persist();render();toast(msg)},
 favToggle:()=>{if(!S.from||!S.to)return toast('출발지와 목적지를 모두 고른 뒤 저장할 수 있어요.');
  const i=S.favs.findIndex(v=>v.from===S.from&&v.to===S.to);
  if(i>=0){const n=S.favs[i].name;S.favs.splice(i,1);toast(`‘${n}’ 즐겨찾기를 해제했어요.`)}
  else{const name=`${placeName(S.from).replace(/\(.+\)/,'')} → ${placeName(S.to).replace(/\(.+\)/,'')}`;S.favs.push({name,from:S.from,to:S.to});toast(`‘${name}’을(를) 즐겨찾기에 저장했어요. 홈과 마이에서 불러올 수 있어요.`)}
  persist();render()},
 favLoad:d=>{const f=S.favs[+d.i];
  S.from=f.from;S.to=f.to;S.delCf=null;S.dir=null;persist();if(S.tab==='my')S.tab='home';S.stack=[];render();toast(`‘${f.name}’ 경로를 불러왔어요.`)},
 favDel:d=>{const i=+d.i;if(S.delCf!==i){S.delCf=i;render();return}const n=S.favs[i].name;S.favs.splice(i,1);S.delCf=null;persist();render();toast(`‘${n}’을(를) 삭제했어요.`)},
 layer:d=>{const L=S.layers;if(L[d.k]&&Object.values(L).filter(Boolean).length===1)return toast('최소 한 가지 이동 수단은 표시돼야 해요.');L[d.k]=!L[d.k];render()},
 stop:d=>{S.stack.push({type:'stop',k:+d.k});render()},
 rent:d=>{const r=RENT.find(x=>x.id===d.id);const n=rentCount(r,T);toast(`공유자전거 ${r.name}: ${n?`대여 가능 ${n}대`:'지금 대여 가능한 기기 없음'}. 대여는 공유자전거 앱에서 해요.`)},
 mapShuttle:()=>{S.stack=[];S.tab='map';render()},
 dir:d=>{S.dir=d.d;fillDyn()},
 favStop:d=>{const i=S.favStops.indexOf(d.id);if(i>=0)S.favStops.splice(i,1);else S.favStops.push(d.id);S.favStops.sort();persist();if(S.step)render();else{const m=$('#main'),y=m?m.scrollTop:0;render();const m2=$('#main');if(m2)m2.scrollTop=y}},
 quick:d=>{if(!S.from||d.f==='from'){if(S.to===d.id)S.to=null;S.from=d.id}else{if(S.from===d.id)return toast('출발과 같은 정류장이에요.');S.to=d.id}S.dir=null;persist();render()},
 grpToggle:d=>{const k=+d.k;S.openGrp=S.openGrp===k?null:k;const q=$('#q');$('#qres').innerHTML=pickerList(q.dataset.field,q.value.trim())},
 callAsk:()=>{const ph=$('#phone');const d=document.createElement('div');d.className='iosdim';d.id='calldlg';
  d.innerHTML=`<div class="iosal" role="alertdialog" aria-label="전화 걸기"><div class="tt" style="padding-bottom:16px">010-3244-4502</div><div class="ms" style="margin-top:-12px">하나신정관광 · 분실물 문의</div><div class="calbtns"><button data-c="no">취소</button><button data-c="yes" style="font-weight:600">통화</button></div></div>`;
  ph.appendChild(d);d.addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;d.remove();if(b.dataset.c==='yes')startCall()})},
 copyTel:()=>{try{navigator.clipboard.writeText('010-3244-4502').then(()=>toast('번호를 복사했어요.'),()=>toast('010-3244-4502'))}catch(e){toast('010-3244-4502')}},
 favAdd:()=>ACT.favToggle(),
 widgetAdd:()=>{S.stack.push({type:'widgetAdd'});render()},
 favList:()=>{S.stack.push({type:'favList'});render()},
 wgOpen:()=>{if(S.wg.from&&S.wg.to){S.from=S.wg.from;S.to=S.wg.to;S.dir=null;persist();S.stack=[];S.tab='home';render()}},
 favNew:()=>{S.fd={name:'',from:null,to:null};S.stack.push({type:'favEdit'});render()},
 favSave:()=>{const d=S.fd;if(!d.from||!d.to||d.from===d.to)return;const nm=(($('#fdname')||{}).value||'').trim()||`${STOPS[stopIdx(d.from)].name} → ${placeName(d.to).replace(/ 정류장$/,'')}`;
  const i=S.favs.findIndex(v=>v.from===d.from&&v.to===d.to);if(i>=0)S.favs[i].name=nm;else S.favs.push({name:nm,from:d.from,to:d.to});persist();S.stack.pop();render();toast(`‘${nm}’을(를) 저장했어요.`)},
 mapZoom:()=>{S.mapZoom=!S.mapZoom;fillDyn()},
 startNav:d=>{S.stack.push({type:'nav',m:d.m,step:0,t0:performance.now()});render()},
 navNext:()=>{const t=cur().top;t.step=Math.min(t.step+1,(t.n||1)-1);t.t0=performance.now();t.adv=false;fillDyn()},
 navPrev:()=>{const t=cur().top;t.step=Math.max(0,t.step-1);t.t0=performance.now();t.adv=false;fillDyn()},
 navEnd:()=>{S.stack=[];S.tab='home';render();toast('안내를 마쳤어요.')},
 help:d=>{S.wmenu=false;S.stack.push({type:'help',open:d.open||null});render();if(d.open){const el=$('#h-'+d.open);if(el)el.scrollIntoView({block:'start'})}},
 widgetMenu:()=>{S.wmenu=!S.wmenu;fillDyn()},
 widgetHide:()=>{S.widget=false;S.wmenu=false;persist();fillDyn();toast('위젯 미리보기를 숨겼어요. 마이 → 설정에서 다시 켤 수 있어요.')},
 widgetShow:()=>{S.widget=true;persist();fillDyn()},
 widgetToggle:()=>{S.widget=!S.widget;persist();render()},
 gpsToggle:()=>{S.gps=!S.gps;persist();render();toast(S.gps?'위치 권한을 허용했어요. 정류장까지 걷는 시간을 함께 알려드려요.':'위치 권한을 껐어요. 정류장 도착 기준으로 안내해요.')},
 offlineToggle:()=>{S.offline=!S.offline;if(!S.offline){S.lastUpd=T;lastFetch=performance.now()}render();toast(S.offline?'연결 끊김 상태로 바꿨어요.':'연결이 복구됐어요.')},
 forceSvc:()=>{S.forceSvc=!S.forceSvc;render();toast(S.forceSvc?'평일 시간표 기준으로 보여드려요.':'오늘 기준으로 돌아왔어요.')},
 plus5:()=>{T+=5;if(!S.offline)S.lastUpd=T;render();toast(`데모 시각을 ${clk(T)}(으)로 옮겼어요.`)},
 reset:()=>{S.step='welcome';S.from=null;S.to=null;S.gps=null;S.stack=[];S.tab='home';S.dir=null;persist();render()},
 perm:d=>{S.gps=d.v==='1';S.permAlert=false;S.step=null;S.tab='home';persist();render()},
 permAsk:()=>{S.permAlert=true;render()},
 onbNext:()=>{S.step=ONB[ONB.indexOf(S.step)+1];render()},
 onbBack:()=>{S.step=ONB[Math.max(0,ONB.indexOf(S.step)-1)];render()},
 onbGo:d=>{S.step=d.s;render()},
 onbFav:()=>{const n=(($('#favname')||{}).value||'').trim()||'등교';S.favs=S.favs.filter(v=>!(v.from===S.from&&v.to===S.to));S.favs.push({name:n,from:S.from,to:S.to});ACT.onbDone();toast(`‘${n}’ 경로를 즐겨찾기에 등록했어요.`)},
 onbDone:()=>{S.step=null;S.tab='home';persist();render()}
};
app.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=ACT[el.dataset.act];if(f){e.preventDefault();f(el.dataset,el)}});
app.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.w;if(!k)return;S.w[k]=+e.target.value;persist();$('#lv-'+k).textContent=LV[S.w[k]];e.target.setAttribute('aria-valuetext',LV[S.w[k]]);fillDyn()});
document.addEventListener('toggle',e=>{if(e.target.id==='tt')S.ttOpen=e.target.open},true);

/* ================= 루프 ================= */
let last=performance.now(),lastFetch=last;
function tick(){const now=performance.now();T+=(now-last)/60000;last=now;if(T>=1440)T-=1440;
 if(!S.offline&&now-lastFetch>=10000){S.lastUpd=T;lastFetch=now}
 if(S.step){live();return}const{top,sc}=cur();
 if(sc.dyn&&sc.sig&&sc.sig(top)!==S._sig){const m=$('#main'),y=m?m.scrollTop:0;fillDyn();if(m)m.scrollTop=y}else live()}
render();setInterval(tick,500);
(function(){const sp=$('#splash');if(!sp)return;$('#smark').innerHTML=MARK(88);setTimeout(()=>sp.classList.add('hide'),1300);setTimeout(()=>sp.remove(),1900)})();
if(shifted)setTimeout(()=>toast('지금은 셔틀 운행 시간이 아니라서 데모 시각을 08:22로 맞췄어요.'),1700);
else if(!SVC_TODAY)setTimeout(()=>toast('오늘은 셔틀이 운행하지 않아요.'),1700);
